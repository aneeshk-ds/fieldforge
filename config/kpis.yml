version: 1
kpis:
  net_revenue:
    label: Net revenue
    owner: Finance Analytics
    grain: calendar_month, revenue_type, currency
    definition: Sum of all valid recognized gross amounts less refunds; cancelled orders excluded. Includes attributed and unattributed transactions.
    model: mart_monthly_kpis
    column: net_revenue_cents
    caveat: Values are presented by transaction currency and are not FX-converted.
  attributed_net_revenue:
    label: Customer-attributed net revenue
    owner: Finance Analytics
    grain: calendar_month, revenue_type, currency
    definition: Net revenue from valid transactions linked to a canonical customer through the identity crosswalk.
    model: mart_monthly_kpis
    column: attributed_net_revenue_cents
    caveat: Suitable for customer-level analysis; excludes financially valid transactions with unresolved identity.
  unattributed_net_revenue:
    label: Unattributed net revenue
    owner: Data Operations
    grain: calendar_month, revenue_type, currency
    definition: Net revenue from valid transactions that cannot currently be linked to a canonical customer.
    model: mart_monthly_kpis
    column: unattributed_net_revenue_cents
    caveat: Included in company totals but excluded from customer-level metrics. Investigate identity coverage; do not invent a customer key.
  revenue_attribution_rate:
    label: Revenue attribution rate
    owner: Data Operations
    grain: calendar_month, revenue_type, currency
    definition: Customer-attributed net revenue divided by total net revenue within the same transaction currency.
    model: mart_monthly_kpis
    column: revenue_attribution_rate
    caveat: Never aggregate monetary values across currencies before calculating this rate.
  active_subscribers:
    label: Active subscribers at month end
    owner: Growth Analytics
    grain: calendar_month, plan_code
    definition: A subscription started on or before month end and was not cancelled before that date; cancellation on month end remains included in that month's snapshot.
    model: mart_subscription_health
    column: active_subscribers
  logo_churn_rate:
    label: Logo churn rate
    owner: Growth Analytics
    grain: calendar_month, plan_code
    definition: Subscriptions cancelling in month divided by subscriptions active at prior month end.
    model: mart_subscription_health
    column: logo_churn_rate
    caveat: Null when the prior-month active denominator is zero.
  support_tickets_opened:
    label: Accepted tickets opened
    owner: Support Operations
    grain: calendar_month, category
    definition: Count of accepted support tickets by opening month and category, including tickets still unresolved and tickets resolved in a later month. No customer-identity join is applied.
    model: mart_support_health
    column: ticket_count
    caveat: Excludes quarantined tickets; this is accepted incoming demand, not resolved tickets or end-of-month backlog. Months and categories with no accepted tickets have no row. Source timestamps have no timezone; month assignment uses the supplied calendar date without conversion.
  order_line_coverage:
    label: Order line coverage status
    owner: Data Operations
    grain: order_id
    definition: Classification of each accepted order as complete, incomplete with a quarantined line on the same order, or incomplete without order-scoped quarantine evidence.
    model: mart_order_line_integrity
    column: line_coverage_status
    caveat: An incomplete order is reported, never repaired. A rejected line that lost its parent order id cannot be attributed back to that order.
  order_line_variance:
    label: Order line variance
    owner: Data Operations
    grain: order_id
    definition: Order header amount less the sum of accepted order line extended amounts, in the order currency.
    model: mart_order_line_integrity
    column: line_variance_cents
    caveat: Never negative, because accepted lines can be missing but are never invented. Do not aggregate across currencies.
  accepted_order_lines:
    label: Accepted order lines
    owner: Data Operations
    grain: order_id, line_number
    definition: Count of accepted order lines in fct_order_item, including lines whose parent order was quarantined.
    model: fct_order_item
    column: order_item_sk
    caveat: Lines with order_link_status 'order_not_accepted' have no order date, status, currency, or customer key.
