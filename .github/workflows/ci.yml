name: CI
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan complete Git history for secrets
        run: >-
          docker run --rm
          -v "${{ github.workspace }}:/repo:ro"
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact --no-banner --no-color /repo
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          cache-local-path: ${{ github.workspace }}/.uv-cache
      - run: make setup-all
      - run: make verify
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fieldforge-evidence
          path: artifacts/
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build Linux application image with Buildx
        run: docker buildx build --platform linux/amd64 --load -t fieldforge-fieldforge:latest -t fieldforge-dashboard:latest .
      - name: Run isolated Compose pipeline gate
        run: >-
          docker compose run --rm --no-deps
          -e FIELDFORGE_DATA_ROOT=/app/data/ci-container
          -e FIELDFORGE_ARTIFACTS_ROOT=/app/artifacts/ci-container
          fieldforge
      - name: Upload container evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fieldforge-container-evidence
          path: artifacts/ci-container/
