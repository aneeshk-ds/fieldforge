name: CI
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: make setup
      - run: .venv/bin/ruff check fieldforge dashboard tests
      - run: make all
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fieldforge-evidence
          path: artifacts/
