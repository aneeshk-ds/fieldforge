version: 2
sources:
  - name: silver
    description: Validated, standardized records that passed every source contract rule.
    meta:
      external_location: "data/silver/{name}.parquet"
      owner: data-platform
    tables:
      - name: customers
      - name: subscriptions
      - name: invoices
      - name: orders
      - name: order_items
      - name: tickets
      - name: identity_crosswalk
  - name: quarantine
    description: Records rejected by a source contract rule, retained with rule code and reason.
    meta:
      external_location: "data/quarantine/{name}.parquet"
      owner: data-platform
    tables:
      - name: order_items
